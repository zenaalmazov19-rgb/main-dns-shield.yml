name: DNS Shield APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Создать Android-проект DNS Shield
        shell: bash
        run: |
          set -e

          mkdir -p project/app/src/main/java/com/example/dnsshield
          mkdir -p project/app/src/main/res/drawable
          mkdir -p project/app/src/main/res/mipmap-hdpi
          mkdir -p project/app/src/main/res/mipmap-mdpi
          mkdir -p project/app/src/main/res/mipmap-xhdpi
          mkdir -p project/app/src/main/res/mipmap-xxhdpi
          mkdir -p project/app/src/main/res/mipmap-xxxhdpi
          mkdir -p project/app/src/main/res/values

          cat > project/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DNS-Shield"
          include(":app")
          EOF

          cat > project/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.6.1" apply false
          }
          EOF

          cat > project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > project/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.example.dnsshield"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.dnsshield"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }
          EOF

          cat > project/app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="bg">#07110D</color>
              <color name="card">#102019</color>
              <color name="card2">#142820</color>
              <color name="green">#55E39A</color>
              <color name="green_dark">#173C2B</color>
              <color name="white">#F4FFF8</color>
              <color name="muted">#9DB0A5</color>
              <color name="red">#FF6B6B</color>
          </resources>
          EOF

          cat > project/app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.DNSShield" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">@color/bg</item>
                  <item name="android:navigationBarColor">@color/bg</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > project/app/src/main/res/drawable/ic_shield.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#173C2B"
                  android:pathData="M54,7 L92,20 L87,59 C82,82 69,94 54,101 C39,94 26,82 21,59 L16,20 Z"/>
              <path
                  android:fillColor="#55E39A"
                  android:pathData="M54,18 L81,27 L77,58 C73,75 64,84 54,90 C44,84 35,75 31,58 L27,27 Z"/>
              <path
                  android:fillColor="#07110D"
                  android:pathData="M54,31 C45,31 38,38 38,47 C38,56 45,63 54,63 C63,63 70,56 70,47 C70,38 63,31 54,31 Z M48,47 C48,43.7 50.7,41 54,41 C57.3,41 60,43.7 60,47 C60,50.3 57.3,53 54,53 C50.7,53 48,50.3 48,47 Z"/>
              <path
                  android:fillColor="#07110D"
                  android:pathData="M38,66 L45,66 L45,76 L38,76 Z M63,66 L70,66 L70,76 L63,76 Z"/>
          </vector>
          EOF

          cat > project/app/src/main/res/drawable/bg_button.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <corners android:radius="18dp"/>
              <solid android:color="#55E39A"/>
          </shape>
          EOF

          cat > project/app/src/main/res/drawable/bg_card.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <corners android:radius="20dp"/>
              <solid android:color="#102019"/>
              <stroke android:width="1dp" android:color="#254A37"/>
          </shape>
          EOF

          cat > project/app/src/main/res/drawable/bg_card_selected.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <corners android:radius="20dp"/>
              <solid android:color="#173C2B"/>
              <stroke android:width="2dp" android:color="#55E39A"/>
          </shape>
          EOF

          cat > project/app/src/main/res/drawable/bg_icon.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <corners android:radius="22dp"/>
              <solid android:color="#173C2B"/>
              <stroke android:width="1dp" android:color="#55E39A"/>
          </shape>
          EOF

          cat > project/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_shield"
                  android:roundIcon="@drawable/ic_shield"
                  android:label="DNS Shield"
                  android:theme="@style/Theme.DNSShield">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > project/app/src/main/java/com/example/dnsshield/MainActivity.java <<'EOF'
          package com.example.dnsshield;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.graphics.drawable.GradientDrawable;

          public class MainActivity extends Activity {
              private final String[] names = {"AdGuard DNS", "AdGuard Family", "Cloudflare Malware"};
              private final String[] hosts = {"dns.adguard-dns.com", "family.adguard-dns.com", "security.cloudflare-dns.com"};
              private int selected = 0;
              private TextView selectedHost;
              private LinearLayout cards;

              private int dp(float v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private GradientDrawable bg(int color, float radius, int strokeColor, int strokeWidth) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(color);
                  d.setCornerRadius(dp(radius));
                  if (strokeWidth > 0) d.setStroke(dp(strokeWidth), strokeColor);
                  return d;
              }

              private TextView text(String s, float size, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setTypeface(Typeface.create("sans", bold ? Typeface.BOLD : Typeface.NORMAL));
                  return t;
              }

              private TextView tv(String s, float size, int color) {
                  return text(s, size, color, false);
              }

              private void margin(View v, int l, int top, int r, int bottom) {
                  LinearLayout.LayoutParams p = (LinearLayout.LayoutParams) v.getLayoutParams();
                  p.setMargins(dp(l), dp(top), dp(r), dp(bottom));
                  v.setLayoutParams(p);
              }

              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);

                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.setBackgroundColor(Color.rgb(7,17,13));

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(20), dp(18), dp(20), dp(28));
                  scroll.addView(root);

                  LinearLayout header = new LinearLayout(this);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  root.addView(header, new LinearLayout.LayoutParams(-1, dp(72)));

                  ImageView icon = new ImageView(this);
                  icon.setImageResource(com.example.dnsshield.R.drawable.ic_shield);
                  icon.setPadding(dp(7), dp(7), dp(7), dp(7));
                  icon.setBackground(bg(Color.rgb(23,60,43), 18, Color.rgb(55,98,76), 1));
                  header.addView(icon, new LinearLayout.LayoutParams(dp(58), dp(58)));

                  LinearLayout titleBox = new LinearLayout(this);
                  titleBox.setOrientation(LinearLayout.VERTICAL);
                  TextView title = text("DNS Shield", 27, Color.rgb(244,255,248), true);
                  TextView sub = tv("Защита DNS без VPN", 14, Color.rgb(157,176,165));
                  titleBox.addView(title);
                  titleBox.addView(sub);
                  LinearLayout.LayoutParams tp = new LinearLayout.LayoutParams(0, -2, 1);
                  tp.setMargins(dp(14), 0, 0, 0);
                  header.addView(titleBox, tp);

                  TextView badge = text("●", 22, Color.rgb(85,227,154), true);
                  header.addView(badge, new LinearLayout.LayoutParams(dp(28), dp(58)));

                  LinearLayout status = new LinearLayout(this);
                  status.setOrientation(LinearLayout.VERTICAL);
                  status.setPadding(dp(18), dp(16), dp(18), dp(16));
                  status.setBackground(bg(Color.rgb(16,32,25), 20, Color.rgb(37,74,55), 1));
                  root.addView(status, new LinearLayout.LayoutParams(-1, -2));
                  TextView st = text("DNS-блокировка", 17, Color.rgb(244,255,248), true);
                  TextView st2 = tv("Приложение не использует VpnService", 13, Color.rgb(157,176,165));
                  status.addView(st);
                  status.addView(st2);
                  margin(st2, 0, 5, 0, 0);

                  TextView note = tv("Выберите DNS-провайдера и откройте настройки Private DNS. Ваш основной VPN останется включён.", 13, Color.rgb(157,176,165));
                  root.addView(note, new LinearLayout.LayoutParams(-1, -2));
                  margin(note, 0, 16, 0, 0);

                  TextView section = text("DNS-блоклист", 20, Color.rgb(244,255,248), true);
                  root.addView(section, new LinearLayout.LayoutParams(-1, -2));
                  margin(section, 0, 0, 0, 8);

                  cards = new LinearLayout(this);
                  cards.setOrientation(LinearLayout.VERTICAL);
                  root.addView(cards, new LinearLayout.LayoutParams(-1, -2));

                  for (int i = 0; i < names.length; i++) addCard(i);

                  Button open = new Button(this);
                  open.setText("Открыть настройки Private DNS");
                  open.setTextSize(15);
                  open.setTextColor(Color.rgb(7,17,13));
                  open.setAllCaps(false);
                  open.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  open.setBackground(bg(Color.rgb(85,227,154), 18, Color.TRANSPARENT, 0));
                  root.addView(open, new LinearLayout.LayoutParams(-1, dp(54)));
                  margin(open, 0, 12, 0, 0);
                  open.setOnClickListener(v -> {
                      try { startActivity(new Intent("android.settings.PRIVATE_DNS_SETTINGS")); }
                      catch (Exception e) { startActivity(new Intent(Settings.ACTION_SETTINGS)); }
                  });

                  Button copy = new Button(this);
                  copy.setText("Скопировать DNS-хостнейм");
                  copy.setTextSize(14);
                  copy.setTextColor(Color.rgb(244,255,248));
                  copy.setAllCaps(false);
                  copy.setBackground(bg(Color.rgb(16,32,25), 18, Color.rgb(37,74,55), 1));
                  root.addView(copy, new LinearLayout.LayoutParams(-1, dp(54)));
                  copy.setOnClickListener(v -> {
                      ClipboardManager cm = (ClipboardManager)getSystemService(Context.CLIPBOARD_SERVICE);
                      cm.setPrimaryClip(ClipData.newPlainText("Private DNS", hosts[selected]));
                      copy.setText("Скопировано: " + hosts[selected]);
                  });

                  selectedHost = tv("", 13, Color.rgb(157,176,165));
                  root.addView(selectedHost, new LinearLayout.LayoutParams(-1, -2));
                  margin(selectedHost, 4, 8, 0, 0);

                  TextView how = text("Как включить", 20, Color.rgb(244,255,248), true);
                  root.addView(how, new LinearLayout.LayoutParams(-1, -2));
                  margin(how, 0, 20, 0, 6);

                  TextView steps = tv(
                      "1. Нажмите «Открыть настройки Private DNS».\n" +
                      "2. Выберите «Имя хоста провайдера Private DNS».\n" +
                      "3. Введите выбранный хостнейм.\n" +
                      "4. Сохраните настройку.\n\n" +
                      "Важно: если основной VPN перехватывает DNS-запросы, Private DNS может не применяться. Тогда DNS-блокировку нужно включить в самом VPN.",
                      13, Color.rgb(157,176,165));
                  root.addView(steps, new LinearLayout.LayoutParams(-1, -2));

                  updateSelection();
                  setContentView(scroll);
              }

              private void addCard(int index) {
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setPadding(dp(16), dp(14), dp(16), dp(14));
                  TextView name = text(names[index], 16, Color.rgb(244,255,248), true);
                  TextView host = tv(hosts[index], 13, Color.rgb(85,227,154));
                  TextView desc = tv(index == 0 ? "Блокировка рекламы и многих трекеров." :
                                    index == 1 ? "Реклама + контент для взрослых." :
                                    "Фильтрация вредоносных доменов.", 12, Color.rgb(157,176,165));
                  card.addView(name);
                  card.addView(host);
                  card.addView(desc);
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, -2);
                  p.setMargins(0, dp(5), 0, dp(5));
                  cards.addView(card, p);
                  final int n = index;
                  card.setOnClickListener(v -> { selected = n; updateSelection(); });
              }

              private void updateSelection() {
                  for (int i = 0; i < cards.getChildCount(); i++) {
                      View v = cards.getChildAt(i);
                      v.setBackground(bg(i == selected ? Color.rgb(23,60,43) : Color.rgb(16,32,25),
                              20, i == selected ? Color.rgb(85,227,154) : Color.rgb(37,74,55), i == selected ? 2 : 1));
                  }
                  if (selectedHost != null) selectedHost.setText("Выбран: " + hosts[selected]);
              }
          }
          EOF

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Собрать APK
        working-directory: project
        shell: bash
        run: |
          set -e
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Переименовать APK
        shell: bash
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk DNS-Shield-v1.2.apk

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: DNS-Shield-v1.2
          path: DNS-Shield-v1.2.apk
          if-no-files-found: error
