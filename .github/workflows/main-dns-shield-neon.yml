name: DNS Shield APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Распаковать DNS Shield
        run: |
          rm -rf project
          mkdir project
          unzip -q DNS-Shield-v1.1-neon.zip -d project

      - name: Собрать APK
        working-directory: project
        run: gradle clean assembleDebug

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: DNS-Shield-v1.1-neon
          path: project/app/build/outputs/apk/debug/app-debug.apk
