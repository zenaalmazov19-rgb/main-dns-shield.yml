name: Сборка APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Создать исправленный проект
        shell: bash
        run: |
          rm -rf project
          mkdir -p project
          cat > /tmp/project.b64 <<'EOF'

EOF
          base64 -d /tmp/project.b64 > /tmp/project.zip
          unzip -q /tmp/project.zip -d project

      - name: Собрать APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: DNS-Shield-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
